<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark" />
    <style>html{background:#070c0a}</style>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Meridian — one dark terminal for Meteora DLMM pools on Solana, crypto news sentiment, a perp screener, and gold & forex market signals."
    />
    <!-- Security: prevent browser from MIME-sniffing the response away from Content-Type -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <!-- Security: prevent clickjacking -->
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <!-- Security: XSS protection (legacy but still useful for older browsers) -->
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    <!-- Security: forbid robots from indexing this dashboard -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Meridian — Solana DeFi &amp; Market Analytics</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
